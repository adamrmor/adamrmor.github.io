<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALA Collection Status - in22</title>
    <style>
        :root {
            --primary-bg: #0f172a;
            --accent-gold: #ffd700;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --border-color: rgba(255, 215, 0, 0.15);
            --success: #10b981;
        }

        body {
            background-color: var(--primary-bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.3) 0, transparent 50%), 
                radial-gradient(at 50% 0%, rgba(15, 23, 42, 1) 0, transparent 50%);
            color: var(--text-main);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .dashboard-card {
            width: 100%;
            max-width: 800px;
            padding: 2rem;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: 1.5rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--accent-gold);
            margin-bottom: 0.5rem;
            display: block;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0;
        }

        .main-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-box {
            background: rgba(15, 23, 42, 0.5);
            padding: 1.5rem;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            display: block;
            color: #fff;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-top: 0.5rem;
            display: block;
        }

        .usage-table-container {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 1rem;
            padding: 1rem;
            margin-top: 1rem;
            overflow-x: auto;
            min-height: 200px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
            text-align: left;
        }

        th {
            color: var(--accent-gold);
            padding: 0.75rem;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
        }

        td {
            padding: 0.75rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--text-main);
        }

        tr:last-child td { border-bottom: none; }

        .status-footer {
            margin-top: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: var(--text-dim);
            padding: 0 0.5rem;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success);
        }

        .loading-text {
            text-align: center;
            padding: 2rem;
            color: var(--text-dim);
            font-style: italic;
        }

        @media (max-width: 600px) {
            .main-stats { grid-template-columns: 1fr; }
            .stat-value { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <div class="header">
            <span class="header-label">Institutional Overview</span>
            <h1>South Australian Museum (in22)</h1>
        </div>
        
        <div class="main-stats">
            <div class="stat-box">
                <span id="total-records" class="stat-value">...</span>
                <span class="stat-label">Total ALA Records</span>
            </div>
            <div class="stat-box">
                <span id="monthly-downloads" class="stat-value">...</span>
                <span class="stat-label">Total Download Events</span>
            </div>
        </div>

        <div class="usage-table-container" id="table-container">
            <div class="loading-text" id="loading">Syncing with ALA Logger...</div>
            <table id="usage-table" style="display:none;">
                <thead>
                    <tr>
                        <th>Usage Category</th>
                        <th style="text-align: right;">Download Events</th>
                        <th style="text-align: right;">Records</th>
                    </tr>
                </thead>
                <tbody id="usage-body">
                    <!-- Data populated by JS -->
                </tbody>
            </table>
        </div>

        <div class="status-footer">
            <div class="status-indicator">
                <div class="dot"></div>
                <span>Live Data Sync Active</span>
            </div>
            <span id="last-update">Last checked: Just now</span>
        </div>
    </div>

    <script>
        // CONFIGURATION: 
        // 1. Create a Google Sheet.
        // 2. In A1, enter: =IMPORTDATA("https://logger.ala.org.au/service/reasonBreakdownCSV?eventId=1002&entityUid=in22")
        // 3. File > Share > Publish to web.
        // 4. Select "Whole Document" and "CSV". 
        // 5. Paste that generated URL below:
        const GOOGLE_SHEET_CSV_URL = ''; 

        async function fetchLiveTotal() {
            const counter = document.getElementById('total-records');
            const apiUrl = 'https://biocache-ws.ala.org.au/ws/occurrences/search?q=collection_uid:in22&pageSize=0';
            
            try {
                const response = await fetch(apiUrl);
                if (response.ok) {
                    const data = await response.json();
                    if(data.totalRecords) {
                        counter.innerText = data.totalRecords.toLocaleString();
                    }
                }
            } catch (error) {
                console.error('Fetch failed:', error);
                counter.innerText = "573,941+"; // Fallback
            }
        }

        async function fetchUsageData() {
            const usageBody = document.getElementById('usage-body');
            const table = document.getElementById('usage-table');
            const loading = document.getElementById('loading');
            const downloadCounter = document.getElementById('monthly-downloads');
            
            // If URL is not set yet, we show the fallback data from your manual snippet
            if (!GOOGLE_SHEET_CSV_URL) {
                console.log("No Google Sheet URL provided. Using initial snapshot.");
                renderFallback();
                return;
            }

            try {
                const response = await fetch(GOOGLE_SHEET_CSV_URL);
                const csvText = await response.text();
                const lines = csvText.split('\n').filter(line => line.trim() !== '');
                
                // Assuming CSV structure: Reason, Events, Records
                let totalEvents = 0;
                let html = '';
                
                // Skip header (i=1)
                for (let i = 1; i < lines.length; i++) {
                    const [reason, events, records] = lines[i].split(',');
                    if (!reason) continue;
                    
                    totalEvents += parseInt(events) || 0;
                    html += `<tr>
                        <td>${reason.replace(/"/g, '')}</td>
                        <td style="text-align: right;">${parseInt(events).toLocaleString()}</td>
                        <td style="text-align: right;">${parseInt(records).toLocaleString()}</td>
                    </tr>`;
                }

                usageBody.innerHTML = html;
                downloadCounter.innerText = totalEvents.toLocaleString();
                loading.style.display = 'none';
                table.style.display = 'table';
                document.getElementById('last-update').innerText = 'Last Sync: ' + new Date().toLocaleTimeString();

            } catch (e) {
                console.error("CSV sync failed", e);
                renderFallback();
            }
        }

        function renderFallback() {
            const usageBody = document.getElementById('usage-body');
            const table = document.getElementById('usage-table');
            const loading = document.getElementById('loading');
            const downloadCounter = document.getElementById('monthly-downloads');

            // Fallback content from previous query
            const fallback = [
                ["Scientific research", "4,761", "2,227,540"],
                ["Conservation management", "53", "104,827"],
                ["Ecological research", "59", "69,562"],
                ["Environmental assessment", "123", "8,382"],
                ["Education", "31", "12,859"],
                ["Citizen science", "20", "7,272"]
            ];

            let html = '';
            fallback.forEach(row => {
                html += `<tr><td>${row[0]}</td><td style="text-align: right;">${row[1]}</td><td style="text-align: right;">${row[2]}</td></tr>`;
            });

            usageBody.innerHTML = html;
            downloadCounter.innerText = "171,924"; // All time events placeholder
            loading.style.display = 'none';
            table.style.display = 'table';
        }

        // Initialize
        fetchLiveTotal();
        fetchUsageData();
        
        // Refresh intervals
        setInterval(fetchLiveTotal, 600000); 
        setInterval(fetchUsageData, 3600000); // Check CSV every hour
    </script>
</body>
</html>
